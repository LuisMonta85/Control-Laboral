<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#4f46e5"><title>Control Laboral</title><link rel="stylesheet" href="styles.css"></head><body>
<header><div class="brand"><div class="logo">CL</div><div><h1>Control Laboral</h1><small>Tu control anual, claro y sencillo</small></div></div><div class="top-actions"><button class="ghost" id="exportBtn">⬇ Copia de seguridad</button><label class="ghost file-btn">⬆ Importar<input id="importInput" type="file" accept="application/json"></label></div></header>
<nav id="tabs"><button class="active" data-view="resumen">Resumen</button><button data-view="calendario">Calendario</button><button data-view="horas">Horas</button><button data-view="vacaciones">Vacaciones</button><button data-view="historial">Historial</button><button data-view="config">Configuración</button></nav>
<main id="app"></main>
<div id="modal" class="modal hidden"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle">Añadir registro</h2><button id="closeModal">×</button></div><form id="recordForm"><input type="hidden" id="editId"><div class="grid2"><label>Fecha<input id="rDate" type="date" required></label><label>Tipo<select id="rType"><option value="extra">Horas extra</option><option value="bote">Horas de bote</option><option value="vacaciones">Vacaciones</option><option value="propio">Asunto propio</option><option value="desplazamiento">Desplazamiento / viaje</option><option value="noche">Noche</option></select></label></div><div class="grid2"><label>Horas<input id="rHours" type="number" step="0.25" min="0" placeholder="Ej. 6"></label><label>Días<input id="rDays" type="number" step="1" min="0" placeholder="Ej. 1"></label></div><label>Descripción / nota<input id="rNote" maxlength="160" placeholder="Detalle opcional"></label><div class="modal-actions"><button type="button" class="secondary" id="cancelModal">Cancelar</button><button class="primary">Guardar</button></div></form></div></div>
<script src="app.js"></script></body></html>
