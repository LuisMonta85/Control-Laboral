<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Control Laboral</title><style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#718096;--primary:#4f46e5;--green:#10b981;--orange:#f59e0b;--red:#ef4444;--blue:#3b82f6;--line:#e7eaf0}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}.app{max-width:1200px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.brand h1{margin:0;font-size:28px}.brand p{margin:4px 0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;background:#e9edf5}.primary{background:var(--primary);color:white}.danger{background:#fee2e2;color:#991b1b}.nav{display:flex;gap:8px;overflow:auto;margin-bottom:18px}.nav button{border:0;background:white;padding:10px 14px;border-radius:10px;cursor:pointer;white-space:nowrap}.nav button.active{background:var(--primary);color:white}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 4px 16px #1f29370a}.metric .label{color:var(--muted);font-size:14px}.metric .value{font-size:28px;font-weight:800;margin:8px 0}.sub{color:var(--muted);font-size:13px}.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;margin-top:14px}.page{margin-top:8px}.page-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.page-title h2{margin:0}.page-title p{margin:4px 0;color:var(--muted)}.notice{background:#eef2ff;border:1px solid #c7d2fe;padding:12px 14px;border-radius:12px;margin-bottom:14px}.months{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.month{border:1px solid var(--line);border-radius:12px;padding:11px}.month b{display:block;margin-bottom:7px}.row{display:flex;justify-content:space-between;padding:6px 0;font-size:14px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid var(--line);font-size:14px}.pill{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700}.extra{background:#dbeafe;color:#1d4ed8}.bote{background:#fef3c7;color:#92400e}.vacaciones{background:#dcfce7;color:#166534}.propio{background:#f3e8ff;color:#7e22ce}.noche{background:#e0e7ff;color:#3730a3}.desplazamiento{background:#fee2e2;color:#991b1b}.actions-cell button{margin-right:5px}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:20px}.modal.hidden{display:none}.box{background:white;border-radius:18px;padding:20px;width:min(520px,100%)}.form{display:grid;gap:12px}.form label{font-size:13px;font-weight:700}.form input,.form select{width:100%;padding:10px;border:1px solid #d6dbe5;border-radius:9px}.twofields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.footer{margin-top:18px;color:var(--muted);font-size:12px;text-align:center}.bar{height:8px;background:#edf0f5;border-radius:20px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--primary)}@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.months{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.app{padding:12px}.cards{grid-template-columns:1fr 1fr}.months{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.page-title{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="app"><header class="top"><div class="brand"><h1>📋 Control Laboral</h1><p>2026 · versión nueva independiente</p></div><div class="actions"><button class="btn" onclick="exportData()">⬇ Copia</button><button class="btn" onclick="document.getElementById('file').click()">⬆ Importar</button><input id="file" type="file" accept="application/json" hidden onchange="importData(this)"></div></header><nav class="nav" id="nav"></nav><main id="page"></main><div class="footer">Datos guardados en una base de datos local del dispositivo · copia de seguridad disponible</div></div><div id="modal" class="modal hidden"><div class="box"><div class="page-title"><h2 id="mtitle">Añadir registro</h2><button class="btn" onclick="closeModal()">✕</button></div><form class="form" id="form"><input id="eid" type="hidden"><label>Fecha<input id="date" type="date" required></label><label>Tipo<select id="type" onchange="updateFormFields()"><option value="extra">Horas extra</option><option value="bote">Horas de bote</option><option value="vacaciones">Vacaciones</option><option value="propio">Asunto propio</option><option value="noche">Noche</option><option value="desplazamiento">Desplazamiento</option></select></label><div class="twofields"><label id="hoursWrap">Horas<input id="hours" type="number" step="0.25" min="0"></label><label id="daysWrap">Días<input id="days" type="number" step="0.5" min="0"></label></div><label>Nota<input id="note" type="text"></label><div class="actions"><button class="btn" type="button" onclick="closeModal()">Cancelar</button><button class="btn primary">Guardar</button></div></form></div></div>
<script>
const VERSION='CL-2026-09-27-IDB1', KEY='control_laboral_FINAL3', OLD_KEY='control_laboral_FINAL1';
const IDB_NAME='ControlLaboralDB', IDB_STORE='datos', IDB_KEY='control-laboral-2026';
const months=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
// Fuente: Cuentas 2026.xlsx. Las sumas del Excel dan 36 h extra, 5 asuntos propios y 23 días de vacaciones. El Excel registra además 10 h de bote.
const seedRecords=[
['2026-01-02','vacaciones',0,1,''],['2026-01-31','extra',6,0,''],['2026-02-21','extra',6,0,''],['2026-03-14','extra',6,0,''],
['2026-03-16','vacaciones',0,1,''],['2026-03-17','vacaciones',0,1,''],['2026-03-18','vacaciones',0,1,''],['2026-03-20','vacaciones',0,1,''],
['2026-05-08','propio',2,0,''],['2026-05-16','extra',6,0,''],['2026-06-06','extra',6,0,''],['2026-06-12','vacaciones',0,1,''],['2026-06-23','extra',6,0,''],
['2026-07-03','propio',3,0,''],['2026-07-18','extra',6,0,''],['2026-08-07','vacaciones',0,1,''],
['2026-09-01','vacaciones',0,5,'Semana 36'],['2026-09-08','vacaciones',0,5,'Semana 37'],['2026-09-15','vacaciones',0,5,'Semana 38'],['2026-10-13','vacaciones',0,1,'']
].map((x,i)=>({id:'seed-'+i,date:x[0],type:x[1],hours:x[2],days:x[3],note:x[4]}));
const nightRecords=[['S.3 Completa','2026-01-01'],['S.6 Completa','2026-02-01'],['S.9 · 3 noches','2026-02-02'],['S.15 Completa','2026-04-01'],['S.18 Completa','2026-05-18'],['S.21 · 4 noches','2026-06-21']].map((x,i)=>({id:'night-'+i,date:x[1],type:'noche',hours:0,days:0,note:x[0]}));
function fresh(){return {version:VERSION,year:2026,extraPrice:28.84,annualOwn:20,annualVac:23,carryVac:5,boteStart:10,records:[...seedRecords,...nightRecords]}}
function load(){try{let raw=localStorage.getItem(KEY); if(!raw) raw=localStorage.getItem(OLD_KEY); const x=raw?JSON.parse(raw):null; if(x&&Array.isArray(x.records)){x.version=VERSION; x.annualVac=23; x.carryVac=5; x.annualOwn=20; if(x.boteStart==null)x.boteStart=10; if(x.extraPrice==null)x.extraPrice=28.84; x.records=x.records.map(r=>r.type==='propio'?{...r,hours:Number(r.hours)||Number(r.days)||0,days:0}:r); localStorage.setItem(KEY,JSON.stringify(x)); return x}}catch(e){} const x=fresh(); localStorage.setItem(KEY,JSON.stringify(x)); return x}
let db=null;
const labels={extra:'Horas extra',bote:'Horas de bote',vacaciones:'Vacaciones',propio:'Asunto propio',noche:'Noche',desplazamiento:'Desplazamiento'};
async function idbOpen(){return new Promise((resolve,reject)=>{const req=indexedDB.open(IDB_NAME,1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(IDB_STORE))req.result.createObjectStore(IDB_STORE)};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function idbGet(){const d=await idbOpen();return new Promise((resolve,reject)=>{const r=d.transaction(IDB_STORE,'readonly').objectStore(IDB_STORE).get(IDB_KEY);r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error)})}
async function idbPut(value){const d=await idbOpen();return new Promise((resolve,reject)=>{const r=d.transaction(IDB_STORE,'readwrite').objectStore(IDB_STORE).put(value,IDB_KEY);r.onsuccess=()=>resolve();r.onerror=()=>reject(r.error)})}
async function save(){try{await idbPut(db);localStorage.setItem(KEY,JSON.stringify(db))}catch(e){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(_){} }}
async function initDB(){try{let x=await idbGet();if(!x){let raw=localStorage.getItem(KEY)||localStorage.getItem(OLD_KEY);x=raw?JSON.parse(raw):fresh();x.version=VERSION;x.annualVac=23;x.carryVac=5;x.annualOwn=20;x.records=(x.records||[]).map(r=>r.type==='propio'?{...r,hours:Number(r.hours)||Number(r.days)||0,days:0}:r);await idbPut(x)}db=x;render('resumen')}catch(e){db=load();render('resumen')}} function money(n){return n.toLocaleString('es-ES',{style:'currency',currency:'EUR'})} function totals(){let r=db.records;return {extra:r.filter(x=>x.type==='extra').reduce((a,x)=>a+(+x.hours||0),0),bote:db.boteStart+r.filter(x=>x.type==='bote').reduce((a,x)=>a+(+x.hours||0),0),vac:r.filter(x=>x.type==='vacaciones').reduce((a,x)=>a+(+x.days||0),0),own:r.filter(x=>x.type==='propio').reduce((a,x)=>a+(+x.hours||0),0),night:r.filter(x=>x.type==='noche').length,travel:r.filter(x=>x.type==='desplazamiento').length}}
function nav(active){document.getElementById('nav').innerHTML=[['resumen','Resumen'],['horas','Horas'],['calendario','Calendario'],['historial','Historial'],['ajustes','Configuración']].map(x=>`<button class="${active===x[0]?'active':''}" onclick="render('${x[0]}')">${x[1]}</button>`).join('')}
function summary(){const t=totals();return `<div class="page-title"><div><h2>Resumen 2026</h2><p>Datos iniciales del Excel cargados en esta aplicación nueva.</p></div><button class="btn primary" onclick="openModal()">＋ Añadir</button></div><div class="notice"><b>Importante:</b> las horas extra y el bote son conceptos independientes. El Excel contiene <b>10 h de bote</b> y las horas extra suman <b>${t.extra} h</b>.</div><div class="cards"><div class="card metric"><div class="label">💶 Horas extra</div><div class="value">${t.extra} h</div><div class="sub">${money(t.extra*db.extraPrice)}</div></div><div class="card metric"><div class="label">🧰 Bote</div><div class="value">${t.bote} h</div><div class="sub">10 h iniciales · sin valor monetario</div></div><div class="card metric"><div class="label">🌴 Vacaciones</div><div class="value">${t.vac} / ${db.annualVac} días</div><div class="sub">Disponibles: ${Math.max(0,db.annualVac-t.vac)} días · Arrastrados aparte: ${db.carryVac} días</div><div class="bar"><i style="width:${Math.min(100,t.vac/db.annualVac*100)}%"></i></div></div><div class="card metric"><div class="label">📝 Asuntos propios</div><div class="value">${t.own} h</div><div class="sub">Disponibles: ${Math.max(0,db.annualOwn-t.own)} h</div><div class="bar"><i style="width:${Math.min(100,t.own/db.annualOwn*100)}%"></i></div></div></div><div class="grid2"><div class="card"><h3>Resumen mensual</h3><div class="months">${months.map((m,i)=>{let r=db.records.filter(x=>new Date(x.date+'T12:00:00').getMonth()===i);let e=r.filter(x=>x.type==='extra').reduce((a,x)=>a+x.hours,0),b=r.filter(x=>x.type==='bote').reduce((a,x)=>a+x.hours,0),v=r.filter(x=>x.type==='vacaciones').reduce((a,x)=>a+x.days,0);return `<div class="month"><b>${m}</b><div class="row"><span>Extras</span><strong>${e} h</strong></div><div class="row"><span>Bote</span><strong>${b} h</strong></div><div class="row"><span>Vacaciones</span><strong>${v} d</strong></div><div class="row"><span>Propios</span><strong>${r.filter(x=>x.type==='propio').reduce((a,x)=>a+x.hours,0)} h</strong></div></div>`}).join('')}</div></div><div class="card"><h3>Otros datos</h3><div class="row"><span>Noches</span><strong>${t.night}</strong></div><div class="row"><span>Desplazamientos</span><strong>${t.travel}</strong></div><div class="row"><span>Precio hora extra</span><strong>${money(db.extraPrice)}</strong></div><div class="row"><span>Valor extras</span><strong>${money(t.extra*db.extraPrice)}</strong></div></div></div>`}
function hours(){let r=db.records.filter(x=>x.type==='extra'||x.type==='bote').sort((a,b)=>b.date.localeCompare(a.date));return `<div class="page-title"><div><h2>Horas</h2><p>Selecciona siempre <b>Horas extra</b> o <b>Horas de bote</b>.</p></div><button class="btn primary" onclick="openModal()">＋ Añadir horas</button></div><div class="cards"><div class="card metric"><div class="label">Horas extra</div><div class="value">${totals().extra} h</div><div class="sub">${money(totals().extra*db.extraPrice)}</div></div><div class="card metric"><div class="label">Bote</div><div class="value">${totals().bote} h</div><div class="sub">Incluye 10 h iniciales</div></div></div><div class="card" style="margin-top:14px"><table class="table"><tr><th>Fecha</th><th>Tipo</th><th>Horas</th><th>Nota</th><th></th></tr>${r.map(x=>`<tr><td>${esdate(x.date)}</td><td><span class="pill ${x.type}">${labels[x.type]}</span></td><td>${x.hours} h</td><td>${x.note||''}</td><td class="actions-cell"><button class="btn" onclick="openModal('${x.id}')">Editar</button><button class="btn danger" onclick="del('${x.id}')">Borrar</button></td></tr>`).join('')}</table></div>`}
function history(){let r=[...db.records].sort((a,b)=>b.date.localeCompare(a.date));return `<div class="page-title"><div><h2>Historial</h2><p>Todos los apuntes importados y los que añadas después.</p></div><button class="btn primary" onclick="openModal()">＋ Añadir</button></div><div class="card"><table class="table"><tr><th>Fecha</th><th>Tipo</th><th>Valor</th><th>Nota</th><th></th></tr>${r.map(x=>`<tr><td>${esdate(x.date)}</td><td><span class="pill ${x.type}">${labels[x.type]}</span></td><td>${x.hours?x.hours+' h':''}${x.days?x.days+' d':''}</td><td>${x.note||''}</td><td class="actions-cell"><button class="btn" onclick="openModal('${x.id}')">Editar</button><button class="btn danger" onclick="del('${x.id}')">Borrar</button></td></tr>`).join('')}</table></div>`}
function calendar(){let sel=window.calendarMonth??new Date().getMonth(),m=Number(sel),y=2026,first=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate(),cells='';for(let i=0;i<first;i++)cells+='<div></div>';for(let d=1;d<=days;d++){let ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,ev=db.records.filter(x=>x.date===ds);cells+=`<div class="card" style="min-height:90px;padding:8px"><b>${d}</b>${ev.map(x=>`<div class="pill ${x.type}" style="display:block;margin-top:5px">${labels[x.type]} ${x.hours?x.hours+'h':''}${x.days?x.days+'d':''}</div>`).join('')}</div>`}return `<div class="page-title"><div><h2>Calendario</h2><p>Consulta cualquier mes de 2026</p></div><div class="actions"><select class="btn" style="background:white;border:1px solid var(--line)" onchange="window.calendarMonth=Number(this.value);render('calendario')">${months.map((name,i)=>`<option value="${i}" ${i===m?'selected':''}>${name} 2026</option>`).join('')}</select><button class="btn primary" onclick="openModal()">＋ Añadir</button></div></div><div class="card"><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px"><b>L</b><b>M</b><b>X</b><b>J</b><b>V</b><b>S</b><b>D</b>${cells}</div></div>`}
function settings(){return `<div class="page-title"><div><h2>Configuración</h2><p>Datos base de tu control laboral.</p></div></div><div class="card"><div class="row"><span>Precio hora extra</span><strong>${money(db.extraPrice)}</strong></div><div class="row"><span>Vacaciones anuales</span><strong>${db.annualVac} días</strong></div><div class="row"><span>Vacaciones año anterior</span><strong>${db.carryVac} días</strong></div><div class="row"><span>Asuntos propios</span><strong>${db.annualOwn} h</strong></div><div class="row"><span>Bote inicial</span><strong>${db.boteStart} h</strong></div><hr><button class="btn danger" onclick="resetData()">Restaurar datos iniciales del Excel</button></div>`}
function render(p='resumen'){nav(p);document.getElementById('page').innerHTML=p==='resumen'?summary():p==='horas'?hours():p==='calendario'?calendar():p==='historial'?history():settings()}
function esdate(s){return new Date(s+'T12:00:00').toLocaleDateString('es-ES')}
function updateFormFields(){const t=document.getElementById('type').value,hw=document.getElementById('hoursWrap'),dw=document.getElementById('daysWrap'),h=document.getElementById('hours'),d=document.getElementById('days');const dayOnly=t==='vacaciones';const hourOnly=t==='extra'||t==='bote'||t==='propio';hw.style.display=hourOnly?'block':'none';dw.style.display=dayOnly?'block':'none';h.required=hourOnly;d.required=dayOnly;if(!hourOnly)h.value='';if(!dayOnly)d.value=''} function openModal(id){let x=id?db.records.find(a=>a.id===id):null;modal.classList.remove('hidden');mtitle.textContent=x?'Editar registro':'Añadir registro';eid.value=x?.id||'';date.value=x?.date||new Date().toISOString().slice(0,10);type.value=x?.type||'extra';hours.value=x?.hours||'';days.value=x?.days||'';note.value=x?.note||'';updateFormFields()}
function closeModal(){modal.classList.add('hidden')}function del(id){if(confirm('¿Borrar este registro?')){db.records=db.records.filter(x=>x.id!==id);save();render(current())}}
function current(){return document.querySelector('.nav .active')?.textContent==='Horas'?'horas':document.querySelector('.nav .active')?.textContent==='Calendario'?'calendario':document.querySelector('.nav .active')?.textContent==='Historial'?'historial':document.querySelector('.nav .active')?.textContent==='Configuración'?'ajustes':'resumen'}
form.onsubmit=e=>{e.preventDefault();const eidEl=document.getElementById('eid'),dateEl=document.getElementById('date'),typeEl=document.getElementById('type'),hoursEl=document.getElementById('hours'),daysEl=document.getElementById('days'),noteEl=document.getElementById('note');let id=eidEl.value,x={id:id||crypto.randomUUID(),date:dateEl.value,type:typeEl.value,hours:Number(hoursEl.value)||0,days:Number(daysEl.value)||0,note:noteEl.value.trim()};if(id)db.records=db.records.map(a=>a.id===id?x:a);else db.records.push(x);save();closeModal();render(current())};
function resetData(){if(confirm('Esto reemplazará los datos actuales por los datos iniciales del Excel. ¿Continuar?')){db=fresh();save();render('resumen')}}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='control-laboral-backup-2026.json';a.click();URL.revokeObjectURL(a.href)}
function importData(inp){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x||!Array.isArray(x.records))throw 0;db=x;db.version=VERSION;save();render('resumen');alert('Copia importada correctamente.')}catch(e){alert('Archivo de copia no válido.')}};r.readAsText(f)}
initDB();
</script></body></html>
